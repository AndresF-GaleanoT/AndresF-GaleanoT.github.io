name: Update Spotify Now Playing

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get and save currently playing track
        env:
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/spotify-now-playing.mjs

      - name: Push to spotify-data branch
        run: |
          git config user.name "spotify-bot"
          git config user.email "spotify-bot@users.noreply.github.com"
          git add portfolio-blog/public/now-playing.json
          git commit -m "Update now-playing.json" || exit 0
          git push origin HEAD:spotify-data --force
